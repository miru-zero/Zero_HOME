name: gpt-snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload Zero_HOME snapshot
        uses: actions/upload-artifact@v4
        with:
          name: zero-home-snapshot
          path: |
            source
            docs
            tasks
            AGENTS.md
            README.md
            .gitignore
          if-no-files-found: error
          retention-days: 7
